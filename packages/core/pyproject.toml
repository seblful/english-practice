[project]
name = "practice-core"
description = "Shared domain for English Practice: content models, exercise queries, the content schema, and the grading prompt."
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

license = "Apache-2.0"

authors = [
    { name = "Aliaksei Chymba", email = "alesha.chimba@gmail.com" }
]
keywords = ["english", "grammar", "sqlite", "prompt"]

# Deliberately tiny and transport-free: every front end ships this package.
dependencies = [
    "pydantic>=2.12.5",
    "jinja2>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Includes `prompts/` and `schema/`: both are read as package resources.
packages = ["src/practice_core"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/practice_core --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/practice_core"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]

# Inherit the repository's lint rules so every package reads the same.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
# Only this package is first-party; the rest read as libraries.
known-first-party = ["practice_core"]

[tool.ty.environment]
root = ["./src"]
