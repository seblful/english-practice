[project]
name = "practice-runtime"
description = "Server-side runtime for English Practice: settings, logging, the chat-model client, and the agent base."
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

license = "Apache-2.0"

authors = [
    { name = "Aliaksei Chymba", email = "alesha.chimba@gmail.com" }
]
keywords = ["settings", "logging", "langchain", "llm"]

# What the bot and the pipeline both need; the app cannot be a consumer.
dependencies = [
    "practice-core",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_runtime"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/practice_runtime --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/practice_runtime"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]

# Inherit the repository's lint rules so every package reads the same.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
# Only this package is first-party; the rest read as libraries.
known-first-party = ["practice_runtime"]

[tool.ty.environment]
root = ["./src"]
