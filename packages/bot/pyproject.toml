[project]
name = "english-practice-bot"
description = "Telegram bot that grades English grammar exercises from English Grammar in Use (Murphy) with a vision LLM."
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

license = "Apache-2.0"

authors = [
    { name = "Aliaksei Chymba", email = "alesha.chimba@gmail.com" }
]
keywords = ["telegram-bot", "english", "grammar", "llm", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Telegram only: the book comes from `practice-core`, the plumbing from runtime.
dependencies = [
    "practice-core",
    "practice-runtime",
    "python-telegram-bot>=21.0",
    "typer>=0.21.1",
]

[project.scripts]
english-practice = "practice_bot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_bot"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/practice_bot --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that hit real I/O (DB, filesystem, network)",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
source = ["src/practice_bot"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]

# Inherit the repository's lint rules so every package reads the same.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
# Only this package is first-party; the rest read as libraries.
known-first-party = ["practice_bot"]

[tool.ty.environment]
# The package, and this directory so `tests.conftest` resolves as pytest does.
root = ["./src", "."]
