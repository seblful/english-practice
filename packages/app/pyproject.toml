[project]
name = "english-practice-app"
description = "Android app that grades English grammar exercises from English Grammar in Use (Murphy) with a vision LLM."
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

license = "Apache-2.0"

authors = [
    { name = "Aliaksei Chymba", email = "alesha.chimba@gmail.com" }
]
keywords = ["android", "flet", "english", "grammar", "llm"]

# `practice-core` is the domain shared with the bot; no provider SDK fits an APK.
dependencies = [
    "practice-core",
    "flet>=0.86.5",
    "httpx>=0.28.1",
    "socksio>=1.0.0",
]

[tool.uv.sources]
practice-core = { path = "../core" }

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.28",
    "pillow>=12.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/practice_app --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/practice_app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
]

# Inherit the repository's lint rules so every package reads the same.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]

[tool.ruff.lint.isort]
# Only this package is first-party; the rest read as libraries.
known-first-party = ["practice_app"]

[tool.ruff.lint.per-file-ignores]
# Repeated because a child table replaces its parent's, with one more directory.
"**/tests/**" = ["D", "S101", "PLR2004", "ARG"]
"tools/**" = ["D103"]

[tool.ty.environment]
# The app package, and the repository root so `tests.conftest` resolves.
root = ["./src", "."]

[tool.flet]
org = "com.seblful"
product = "English Practice"
company = "Aliaksei Chymba"
copyright = "Copyright (C) 2026 by Aliaksei Chymba"
# `practice-core` lives in this repository, so the build installs it from source.
dev_packages = { practice-core = "../core" }

[tool.flet.app]
path = "src"
# `.flet/` holds a local settings file, and must not hand an install a key.
exclude = [".flet"]

[tool.flet.android]
# sqlite3 needs a real file, and shipping it extracted saves the first launch.
extract_packages = ["practice_app"]

[tool.flet.splash]
color = "#fafafc"
dark_color = "#121418"
