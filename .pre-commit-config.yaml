repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.7
    hooks:
      - id: uv-lock
      - id: uv-lock
        name: uv-lock (app)
        args: [--project, packages/app]
        files: ^packages/app/(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  # One type check per package: each resolves a different dependency set.
  - repo: local
    hooks:
      - id: ty-core
        name: ty type check (core)
        entry: uv run --directory packages/core ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-runtime
        name: ty type check (runtime)
        entry: uv run --directory packages/runtime ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-bot
        name: ty type check (bot)
        entry: uv run --directory packages/bot ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-extraction
        name: ty type check (extraction)
        entry: uv run --directory packages/extraction ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: ty-app
        name: ty type check (app)
        entry: uv run --directory packages/app ty check
        language: system
        types: [python]
        pass_filenames: false
