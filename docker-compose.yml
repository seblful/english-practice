services:
  bot:
    build: .
    container_name: english-practice-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      # .dockerignore keeps secrets out of the image, so compose injects them.
      - path: .env.production
        required: false
    environment:
      # Selects .env.production and feeds Settings.app.environment.
      - APP__ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
