services:
  bot:
    build: .
    container_name: english-practice-bot
    restart: unless-stopped
    # .dockerignore keeps secrets out of the image, so compose injects them.
    env_file:
      - path: .env
        required: true
    environment:
      # Feeds Settings.app.environment: production logs are JSON.
      - APP_ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
