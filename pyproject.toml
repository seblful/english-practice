[project]
name = "english-practice"
description = "Telegram bot that grades English grammar exercises from English Grammar in Use (Murphy) with a vision LLM."
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "Aliaksei Chymba", email = "alesha.chimba@gmail.com" }
]
keywords = ["telegram-bot", "english", "grammar", "llm", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "practice-core",
    "mistralai>=1.2.0",
    "pillow>=12.1.0",
    "tqdm>=4.66.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.26.7",
    "typer>=0.21.1",
    "structlog>=24.0.0",
    "opencv-python>=4.13.0.92",
    "python-telegram-bot>=21.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "jinja2>=3.1.2",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.28",
    "mdformat>=1.0.0",
    "pre-commit>=4.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
english-practice = "english_practice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_practice"]

# `core/` holds the domain both front ends share; `mobile/` is a separate
# project on purpose — it must resolve a much smaller dependency set than the
# bot, so it keeps its own lock file and is not a workspace member.
[tool.uv.workspace]
members = ["core"]

[tool.uv.sources]
practice-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/english_practice --cov=scripts --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that hit real I/O (DB, filesystem, network)",
    "slow: tests that take more than a second",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
# `mobile/` resolves a different dependency set (Flet, httpx) that this
# project's environment does not carry, so it is linted and type-checked from
# its own directory. `core/` is a workspace member and stays in scope here.
extend-exclude = ["mobile"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "PT", "TCH", "RUF",
    "PL",    # Pylint rules
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "D",     # pydocstyle — enforce Google-style docstrings
]
ignore = [
    "D100", "D104",  # Missing docstring in public module/package
    "D203",          # Conflicts with D211
    "D213",          # Conflicts with D212
    "PLR0913",       # Too many arguments (context-dependent)
]

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
known-first-party = ["english_practice", "scripts"]

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings, may use asserts, magic values, and unused fixture args.
"tests/**" = ["D", "S101", "PLR2004", "ARG"]

[tool.ty.src]
exclude = ["mobile"]

[tool.coverage.run]
source = ["src/english_practice", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
