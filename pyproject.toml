# A uv workspace, not a package: every deliverable lives under `packages/`.

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/runtime",
    "packages/bot",
    "packages/extraction",
]
# Excluded: Flet's prebuilt Android wheels, so the app keeps its own lock file.
exclude = ["packages/app"]

[tool.uv.sources]
practice-core = { workspace = true }
practice-runtime = { workspace = true }

# Each package also declares what its own checks need, so it stands alone.
[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.28",
    "mdformat>=1.0.0",
    "pre-commit>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

# --- Lint and format rules, extended by every package ---

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "PT", "TCH", "RUF",
    "PL",    # Pylint rules
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "D",     # pydocstyle — enforce Google-style docstrings
]
ignore = [
    "D100", "D104",  # Missing docstring in public module/package
    "D203",          # Conflicts with D211
    "D213",          # Conflicts with D212
    "PLR0913",       # Too many arguments (context-dependent)
]

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings, may use asserts, magic values, and unused fixture args.
"**/tests/**" = ["D", "S101", "PLR2004", "ARG"]

[tool.ruff.lint.isort]
known-first-party = [
    "practice_core",
    "practice_runtime",
    "practice_bot",
    "practice_app",
    "practice_extraction",
]
